{% extends "web/base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<div class="container page-section">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <article class="bg-faded p-5 rounded">
        
        <div class="post-header mb-4">
          <h1 class="section-heading-lower mb-2">{{ post.title }}</h1>
          <p class="text-muted small">
            Publicado el {{ post.publish }} por <strong>{{ post.author }}</strong>
          </p>
        </div>

        {% if post.image %}
          <div class="mb-4 text-center">
            <img src="{{ post.image.url }}" alt="{{ post.title }}" class="img-fluid rounded" style="max-height: 500px; width: auto; object-fit: cover;">
          </div>
        {% endif %}

        <div class="post-body section-content mb-4">
          {{ post.body|safe }}
        </div>

        <hr>

        <div class="mt-3">
          <a href="{% url 'blog:post_list' %}" class="btn btn-primary btn-sm">
            ← Volver al blog
          </a>
        </div>

      </article>
    </div>
  </div>
</div>
{% endblock %}
